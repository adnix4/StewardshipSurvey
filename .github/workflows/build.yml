name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Only the web and test projects are in the solution. The MAUI project is deliberately
      # left out - it needs workloads that are not available on a Linux runner.
      - name: Restore
        run: dotnet restore StewardshipSurvey.sln

      - name: Build
        run: dotnet build StewardshipSurvey.sln --no-restore --configuration Release

      # Integration tests run against SQLite in-memory, so no database service is needed.
      - name: Test
        run: dotnet test StewardshipSurvey.sln --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
